apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "invokeai.redhat.com/v1alpha1",
          "kind": "InvokeAIPlatform",
          "metadata": {
            "name": "my-studio",
            "namespace": "ai-workloads"
          },
          "spec": {
            "backends": [
              {
                "extraArgs": [
                  "--stage-overrides={\"0\": {\"gpu_memory_utilization\": 0.65}}"
                ],
                "model": "Qwen/Qwen2.5-Omni-7B",
                "name": "reasoning",
                "resources": {
                  "limits": {
                    "cpu": "8",
                    "memory": "32Gi",
                    "nvidia.com/gpu": "1"
                  },
                  "requests": {
                    "cpu": "4",
                    "memory": "24Gi",
                    "nvidia.com/gpu": "1"
                  }
                },
                "role": "reasoning",
                "runtime": "vllm-multimodal"
              },
              {
                "model": "black-forest-labs/FLUX.2-klein-4B",
                "name": "image-generation",
                "resources": {
                  "limits": {
                    "cpu": "4",
                    "memory": "24Gi",
                    "nvidia.com/gpu": "1"
                  },
                  "requests": {
                    "cpu": "2",
                    "memory": "16Gi",
                    "nvidia.com/gpu": "1"
                  }
                },
                "role": "image-generation",
                "runtime": "vllm-multimodal"
              }
            ],
            "invokeai": {
              "image": "quay.io/redhat-et/invokeai-vllm-omni-bridge:latest",
              "port": 9090,
              "resources": {
                "limits": {
                  "cpu": "4",
                  "memory": "16Gi"
                },
                "requests": {
                  "cpu": "2",
                  "memory": "8Gi"
                }
              }
            }
          }
        }
      ]
    capabilities: Basic Install
    createdAt: "2026-08-18T10:23:46Z"
    operators.operatorframework.io/builder: operator-sdk-v1.42.3
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
  name: invokeai-operator.v0.0.1
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: InvokeAIPlatform is the Schema for the invokeaiplatforms API.
      displayName: Invoke AIPlatform
      kind: InvokeAIPlatform
      name: invokeaiplatforms.invokeai.redhat.com
      version: v1alpha1
  description: A Kubernetes operator for deploying and managing InvokeAI on OpenShift
    and Kubernetes, with optional KServe inference backend wiring.
  displayName: InvokeAI Operator
  icon:
  - base64data: 
    mediatype: image/svg+xml
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - services
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - apps
          resources:
          - deployments
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - invokeai.redhat.com
          resources:
          - invokeaiplatforms
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - invokeai.redhat.com
          resources:
          - invokeaiplatforms/finalizers
          verbs:
          - update
        - apiGroups:
          - invokeai.redhat.com
          resources:
          - invokeaiplatforms/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - serving.kserve.io
          resources:
          - inferenceservices
          - servingruntimes
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
        - apiGroups:
          - authorization.k8s.io
          resources:
          - subjectaccessreviews
          verbs:
          - create
        serviceAccountName: invokeai-operator-controller-manager
      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: invokeai-operator
          control-plane: controller-manager
        name: invokeai-operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: invokeai-operator
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: invokeai-operator
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                command:
                - /manager
                image: quay.io/redhat-et/invokeai-operator:v0.0.1
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: invokeai-operator-controller-manager
              terminationGracePeriodSeconds: 10
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: invokeai-operator-controller-manager
    strategy: deployment
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - invokeai
  - ai
  - machine-learning
  - kserve
  links:
  - name: InvokeAI Operator
    url: https://github.com/red-hat-et/invokeai-operator
  maintainers:
  - email: stadic@redhat.com
    name: sttadic
  maturity: alpha
  provider:
    name: Stjepan Tadic
  version: 0.0.1
